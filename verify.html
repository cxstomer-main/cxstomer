<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guest Verification - CXSTOMER Regional Meet</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a1a 50%, #0d0d0d 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: #ffffff;
        }

        .verification-card {
            background: linear-gradient(145deg, #141414 0%, #1e1e1e 100%);
            border-radius: 24px;
            padding: 48px 40px;
            max-width: 420px;
            width: 100%;
            text-align: center;
            box-shadow: 
                0 25px 80px rgba(0, 0, 0, 0.6),
                0 0 0 1px rgba(212, 175, 55, 0.1),
                inset 0 1px 0 rgba(255, 255, 255, 0.05);
            position: relative;
            overflow: hidden;
        }

        .verification-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, #d4af37, #f4d03f, #d4af37);
            background-size: 200% 100%;
            animation: shimmer 3s ease-in-out infinite;
        }

        @keyframes shimmer {
            0%, 100% { background-position: 200% 0; }
            50% { background-position: -200% 0; }
        }

        .status-indicator {
            width: 180px;
            height: 180px;
            margin: 0 auto 32px;
            border-radius: 50%;
            padding: 8px;
            position: relative;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .status-indicator.pass {
            background: linear-gradient(135deg, #22c55e 0%, #16a34a 100%);
            box-shadow: 
                0 0 40px rgba(34, 197, 94, 0.4),
                0 0 80px rgba(34, 197, 94, 0.2),
                inset 0 2px 4px rgba(255, 255, 255, 0.2);
        }

        .status-indicator.driver {
            background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
            box-shadow: 
                0 0 40px rgba(239, 68, 68, 0.4),
                0 0 80px rgba(239, 68, 68, 0.2),
                inset 0 2px 4px rgba(255, 255, 255, 0.2);
        }

        .status-indicator.error {
            background: linear-gradient(135deg, #6b7280 0%, #4b5563 100%);
            box-shadow: 
                0 0 40px rgba(107, 114, 128, 0.3),
                0 0 80px rgba(107, 114, 128, 0.15);
        }

        .photo-container {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            overflow: hidden;
            background: linear-gradient(145deg, #1a1a1a 0%, #0d0d0d 100%);
            border: 3px solid rgba(0, 0, 0, 0.3);
            position: relative;
        }

        .photo-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s ease;
        }

        .photo-container:hover img {
            transform: scale(1.05);
        }

        .photo-placeholder {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(145deg, #1a1a1a 0%, #0d0d0d 100%);
        }

        .photo-placeholder svg {
            width: 60px;
            height: 60px;
            opacity: 0.4;
        }

        .guest-name {
            font-size: 28px;
            font-weight: 600;
            color: #ffffff;
            margin-bottom: 12px;
            letter-spacing: -0.02em;
            line-height: 1.3;
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 12px 24px;
            border-radius: 50px;
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            margin-bottom: 20px;
            transition: all 0.3s ease;
        }

        .status-badge.pass {
            background: rgba(34, 197, 94, 0.15);
            color: #4ade80;
            border: 1px solid rgba(34, 197, 94, 0.3);
        }

        .status-badge.driver {
            background: rgba(239, 68, 68, 0.15);
            color: #f87171;
            border: 1px solid rgba(239, 68, 68, 0.3);
        }

        .status-badge.error {
            background: rgba(107, 114, 128, 0.15);
            color: #9ca3af;
            border: 1px solid rgba(107, 114, 128, 0.3);
        }

        .status-icon {
            width: 16px;
            height: 16px;
        }

        .message {
            font-size: 18px;
            font-weight: 500;
            line-height: 1.5;
            padding: 20px;
            border-radius: 16px;
            margin-top: 8px;
        }

        .message.pass {
            background: linear-gradient(135deg, rgba(34, 197, 94, 0.1) 0%, rgba(22, 163, 74, 0.05) 100%);
            color: #4ade80;
            border: 1px solid rgba(34, 197, 94, 0.2);
        }

        .message.driver {
            background: linear-gradient(135deg, rgba(239, 68, 68, 0.1) 0%, rgba(220, 38, 38, 0.05) 100%);
            color: #f87171;
            border: 1px solid rgba(239, 68, 68, 0.2);
        }

        .message.error {
            background: linear-gradient(135deg, rgba(107, 114, 128, 0.1) 0%, rgba(75, 85, 99, 0.05) 100%);
            color: #9ca3af;
            border: 1px solid rgba(107, 114, 128, 0.2);
        }

        .logo {
            margin-bottom: 32px;
        }

        .logo-text {
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 0.25em;
            text-transform: uppercase;
            color: #d4af37;
            background: linear-gradient(90deg, #d4af37, #f4d03f, #d4af37);
            background-size: 200% 100%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: shimmer 3s ease-in-out infinite;
        }

        .divider {
            width: 60px;
            height: 2px;
            background: linear-gradient(90deg, transparent, #d4af37, transparent);
            margin: 0 auto 24px;
            opacity: 0.5;
        }

        .error-icon {
            width: 80px;
            height: 80px;
            margin: 0 auto 24px;
            opacity: 0.6;
        }

        .qr-hint {
            font-size: 13px;
            color: #6b7280;
            margin-top: 16px;
            font-weight: 400;
        }

        /* Loading animation */
        .loading-pulse {
            animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        /* Responsive adjustments */
        @media (max-width: 480px) {
            .verification-card {
                padding: 36px 24px;
            }

            .status-indicator {
                width: 150px;
                height: 150px;
            }

            .guest-name {
                font-size: 22px;
            }

            .message {
                font-size: 16px;
                padding: 16px;
            }
        }
    </style>
</head>
<body>
    <div class="verification-card">
        <div class="logo">
            <span class="logo-text">CXSTOMER Regional Meet</span>
        </div>
        
        <div id="content">
            <!-- Content will be dynamically inserted here -->
        </div>
    </div>

    <script>
        // Get URL parameters
        function getUrlParams() {
            const params = new URLSearchParams(window.location.search);
            return {
                name: params.get('name'),
                status: params.get('status'),
                photo: params.get('photo') // Optional: specific photo filename
            };
        }

        // Format name nicely (capitalize first letter of each word, replace hyphens/underscores with spaces)
        function formatName(name) {
            if (!name) return '';
            return decodeURIComponent(name)
                .replace(/[-_]/g, ' ')
                .trim();
        }

        // Map status values to internal codes
        function mapStatus(status) {
            if (!status) return null;
            const s = status.toLowerCase().trim();
            if (s === 'yes' || s === 'pass' || s === 'approved') return 'pass';
            if (s === 'no' || s === 'driver' || s === 'restricted') return 'driver';
            return s;
        }

        // Create the verification display
        function renderVerification() {
            const { name, status, photo } = getUrlParams();
            const contentDiv = document.getElementById('content');

            // Check for missing parameters
            if (!name || !status) {
                contentDiv.innerHTML = `
                    <div class="status-indicator error loading-pulse">
                        <div class="photo-container">
                            <div class="photo-placeholder">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                                    <path d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
                                </svg>
                            </div>
                        </div>
                    </div>
                    <div class="divider"></div>
                    <div class="status-badge error">
                        <svg class="status-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
                        </svg>
                        Invalid QR Code
                    </div>
                    <div class="message error">
                        Please Scan Valid QR Code
                    </div>
                    <p class="qr-hint">Ensure the QR code contains name and status parameters</p>
                `;
                return;
            }

            const formattedName = formatName(name);
            const mappedStatus = mapStatus(status);
            
            // Determine photo path: use 'photo' param if provided, otherwise use URL-encoded name
            const photoFilename = photo ? photo : encodeURIComponent(name);
            const photoPath = `assets/guests/${photoFilename}.jpg`;

            // Determine status styling and message
            const isPass = mappedStatus === 'pass';
            const isDriver = mappedStatus === 'driver';
            const statusClass = isPass ? 'pass' : isDriver ? 'driver' : 'error';
            const statusText = isPass ? 'Verified' : isDriver ? 'Restricted' : 'Unknown';
            const message = isPass 
                ? 'APPROVED FOR MOBILE BAR' 
                : isDriver 
                    ? 'STRICTLY NO ALCOHOL - DRIVER' 
                    : 'UNKNOWN STATUS';

            // Create the verification card content
            contentDiv.innerHTML = `
                <div class="status-indicator ${statusClass}">
                    <div class="photo-container">
                        <img 
                            src="${photoPath}" 
                            alt="${formattedName}" 
                            onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';"
                        >
                        <div class="photo-placeholder" style="display: none;">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                                <path d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
                            </svg>
                        </div>
                    </div>
                </div>
                <div class="divider"></div>
                <h1 class="guest-name">${formattedName}</h1>
                <div class="status-badge ${statusClass}">
                    ${isPass ? `
                        <svg class="status-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                            <path d="M5 13l4 4L19 7"/>
                        </svg>
                    ` : isDriver ? `
                        <svg class="status-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M18.364 18.364A9 9 0 005.636 5.636m12.728 12.728A9 9 0 015.636 5.636m12.728 12.728L5.636 5.636"/>
                        </svg>
                    ` : `
                        <svg class="status-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M8.228 9c.549-1.165 2.03-2 3.772-2 2.21 0 4 1.343 4 3 0 1.4-1.278 2.575-3.006 2.907-.542.104-.994.54-.994 1.093m0 3h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
                        </svg>
                    `}
                    ${statusText}
                </div>
                <div class="message ${statusClass}">
                    ${message}
                </div>
            `;
        }

        // Initialize on page load
        document.addEventListener('DOMContentLoaded', renderVerification);
    </script>
</body>
</html>
